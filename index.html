<body>
<title>Sosigdoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: masthead, then board (left) + friends' leaderboard (right); stacks on phones. */
:root{
  --bg:#EEF1E8; --panel:#FBFCF8; --ink:#1F2A24; --muted:#5E6B63; --line:#D3DACB;
  --accent:#1D6A5C; --accent-ink:#FFFFFF; --warn:#C23A2B; --gold:#B8860B;
  --halo:rgba(255,255,255,.55); --tile:#D9CBB8; --edge:#1F2A24; --thin:rgba(31,42,36,.22); --dog:#7B4524; --dog-dark:#3E1F0C; --mark:#6B756E;
  --r0:#FBDDD6; --r1:#FCEDC6; --r2:#DFF0CF; --r3:#CFE8EE; --r4:#E2DBF4; --r5:#F9DCEA; --r6:#EFE4D0; --r7:#D5E9DB; --r8:#DCE3F2;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A17; --panel:#1C2420; --ink:#E8EDE6; --muted:#9DA9A1; --line:#2E3933;
  --accent:#4FB7A2; --accent-ink:#0E1513; --warn:#FF7B6B; --gold:#E3B54A;
  --halo:rgba(255,235,210,.45); --tile:#3A332B; --edge:#070A08; --thin:rgba(0,0,0,.38); --dog:#8C5630; --dog-dark:#3E1F0C; --mark:#3E4641;
  --r0:#E3B1A8; --r1:#E6CD95; --r2:#B5D49A; --r3:#9CCBD5; --r4:#BFB3E3; --r5:#E2AFCB; --r6:#D6C4A2; --r7:#A8CFB5; --r8:#B5C2E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --panel:#1C2420; --ink:#E8EDE6; --muted:#9DA9A1; --line:#2E3933;
  --accent:#4FB7A2; --accent-ink:#0E1513; --warn:#FF7B6B; --gold:#E3B54A;
  --halo:rgba(255,235,210,.45); --tile:#3A332B; --edge:#070A08; --thin:rgba(0,0,0,.38); --dog:#8C5630; --dog-dark:#3E1F0C; --mark:#3E4641;
  --r0:#E3B1A8; --r1:#E6CD95; --r2:#B5D49A; --r3:#9CCBD5; --r4:#BFB3E3; --r5:#E2AFCB; --r6:#D6C4A2; --r7:#A8CFB5; --r8:#B5C2E0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
header.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1;margin:0;letter-spacing:.01em}
.logo svg{width:64px;height:auto;flex:none}
.meta{color:var(--muted);font-size:13px;text-align:right}
.meta{display:flex;align-items:center;gap:8px}
.daysel{font:inherit;font-weight:800;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;max-width:100%}
.daysel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b.bad{color:var(--warn)}
.boardbox{position:relative}
.board{display:grid;width:100%;aspect-ratio:1;max-width:100%;border:0;border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--panel)}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;padding:0;margin:0;font:inherit;color:var(--mark)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:2}
.cell svg.x{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.cell svg.x.bad{color:#C8352A;opacity:1}
.cell svg.dogi{width:86%;height:auto;max-height:100%;filter:drop-shadow(0 0 1.5px var(--halo))}
.cell.err{animation:shake .35s}
.cell.hit svg.dogi{animation:dogIn .75s cubic-bezier(.2,.8,.3,1) both;transform-origin:50% 90%}
.cell.hit::after{content:"";position:absolute;inset:18%;border-radius:50%;border:3px solid var(--dog);opacity:0;animation:ring .6s ease-out;pointer-events:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes dogIn{0%{transform:translateY(55%) scale(.2);opacity:0}45%{transform:translateY(-14%) scale(1.18);opacity:1}62%{transform:translateY(0) scale(.94,1.04)}74%{transform:rotate(-7deg)}86%{transform:rotate(5deg)}100%{transform:none}}
@keyframes ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.cell.err,.cell.hit svg.dogi,.cell.hit::after{animation:none}}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:6px;text-align:center;padding:16px}
.veil h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.veil p{margin:0;color:var(--muted);max-width:32ch}
button.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:12px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:16px}
button.btn:focus-visible,button.ghost:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.btn[disabled]{opacity:.5;cursor:default}
button.ghost{font:inherit;font-weight:600;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.rules{margin-top:14px;color:var(--muted);font-size:13px;display:grid;gap:4px}
.rules b{color:var(--ink)}
h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.tabs{display:flex;gap:6px;margin:10px 0 12px}
.tabs button{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.me td{font-weight:800}
.rank{width:28px;font-weight:800;color:var(--muted)}
.rank.first{color:var(--gold)}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--line);color:var(--muted)}
.empty{color:var(--muted);padding:14px 0;font-size:14px}
.tablebox{overflow-x:auto}
.namerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.namerow input{font:inherit;flex:1 1 160px;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.note.warn{color:var(--warn)}
.you{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.youline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.youhint{font-size:12px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:var(--ink)}
.joinpane{display:grid;gap:6px;justify-items:center;width:min(300px,100%)}
.joinpane label{font-size:13px;font-weight:600}
.joinpane .namerow{width:100%;margin:0}
.linkbtn{font:inherit;font-size:12px;background:none;border:0;padding:2px;color:var(--accent);text-decoration:underline;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:520px){.howto{grid-template-columns:minmax(0,1fr)}}
.rule{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);min-width:0}
.rule p{margin:0;font-weight:800;font-size:15px;line-height:1.25}
.mini{display:grid;grid-template-columns:repeat(3,24px);grid-auto-rows:24px;gap:3px;flex:none}
.mini i{border-radius:5px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.mini i.x{background:var(--dog)}
.mini i.x::before{content:"";width:62%;height:62%;background:linear-gradient(45deg,transparent 42%,#fff 42%,#fff 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,#fff 42%,#fff 58%,transparent 58%)}
.mini i.d svg{width:92%;height:auto;filter:drop-shadow(0 0 1px var(--halo))}
.awards{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 16%,var(--panel));margin-bottom:10px;font-size:14px;display:grid;gap:2px}
.awt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.done-card{margin-top:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));font-size:14px}
.done-card b{font-size:18px}
</style>

<div class="wrap">
  <header class="mast">
    <div class="logo">
      <svg viewBox="0 0 48 26" aria-hidden="true"><use href="#dog"/></svg>
      <h1>Sosigdoku</h1>
    </div>
    <div class="meta"><label for="daySel">Puzzle</label><select id="daySel" class="daysel"></select></div>
  </header>

  <div class="grid2">
    <section class="panel" aria-label="Today's puzzle">
      <div class="hud">
        <div class="stat"><span>Time</span><b id="timer">0:00</b></div>
        <div class="stat"><span>Dogs</span><b id="dogCount">0/9</b></div>
        <div class="stat"><span>Mistakes</span><b id="mistakes">0</b></div>
        <div class="stat"><span>Score</span><b id="scoreNow">0:00</b></div>
      </div>
      <div class="boardbox">
        <div class="board" id="board" role="grid" aria-label="Puzzle board"></div>
        <div class="veil" id="veil">
          <h2 id="veilTitle">Fetching today's dogs…</h2>
          <p id="veilText">Building the board.</p>
          <div id="nameBox" hidden>
            <div id="joinNew" class="joinpane">
              <label for="nameInput">Your name on the leaderboard</label>
              <div class="namerow"><input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="e.g. Charlotte"></div>
              <button type="button" class="linkbtn" id="haveCode">Played before on another device? Use your player code</button>
            </div>
            <div id="joinCode" class="joinpane" hidden>
              <label for="codeInput">Your player code</label>
              <div class="namerow"><input id="codeInput" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. K7QM-2XPA"></div>
              <button type="button" class="linkbtn" id="newPlayer">New here? Join with your name instead</button>
            </div>
          </div>
          <button class="btn" id="startBtn" hidden>Start the clock</button>
        </div>
      </div>
      <div id="doneCard" class="done-card" hidden></div>
      <div class="howto" aria-label="How to play">
        <div class="rule"><div class="mini" aria-hidden="true"><i class="x"></i><i class="x"></i><i class="x"></i><i class="x"></i><i class="d"><svg viewBox="0 0 48 26" aria-hidden="true"><use href="#dog"/></svg></i><i></i><i class="x"></i><i></i><i></i></div><p>1 sausage dog per colour</p></div>
        <div class="rule"><div class="mini" aria-hidden="true"><i class="x"></i><i class="d"><svg viewBox="0 0 48 26" aria-hidden="true"><use href="#dog"/></svg></i><i class="x"></i><i></i><i class="x"></i><i></i><i></i><i class="x"></i><i></i></div><p>1 per column and row</p></div>
        <div class="rule"><div class="mini" aria-hidden="true"><i class="x"></i><i class="x"></i><i class="x"></i><i class="x"></i><i class="d"><svg viewBox="0 0 48 26" aria-hidden="true"><use href="#dog"/></svg></i><i class="x"></i><i class="x"></i><i class="x"></i><i class="x"></i></div><p>Dogs can't touch</p></div>
      </div>
    </section>

    <aside class="panel" aria-label="Leaderboard">
      <h3>Leaderboard</h3>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabToday" aria-selected="true">Daily</button>
        <button role="tab" id="tabWeek" aria-selected="false">This week</button>
        <button role="tab" id="tabAll" aria-selected="false">Overall</button>
      </div>
      <div class="tablebox" id="lb"><div class="empty">Loading scores…</div></div>
      <div class="note" id="lbNote"></div>
      <div class="you" id="youRow" hidden>
        <div class="youline"><span>Playing as <b id="youName"></b></span><button class="ghost" id="renameBtn">Change name</button></div>
        <div class="namerow" id="renameRow" hidden style="margin:0"><input id="renameInput" maxlength="20" aria-label="New name"><button class="ghost" id="renameSave">Save</button><button class="ghost" id="renameCancel">Cancel</button></div>
        <div class="youline"><span>Your player code <b id="youCode" class="code"></b></span><button class="ghost" id="copyCode">Copy</button></div>
        <div class="youhint">Use this code to play on another phone or computer. <button type="button" class="linkbtn" id="switchBtn">Not you? Switch player</button></div>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
// ---- Leaderboard settings: paste your Supabase Project URL and publishable (anon) key here ----
const SUPABASE_URL = 'https://ogyidtomuajcbsqlkviy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_faSQI_E2Y_aRDvbT0PwxXg_PUYITPb_';
// -------------------------------------------------------------------------------------------------
const N = 9, PENALTY = 30000, EPOCH = '2026-10-01';
// ---------- date ----------
function londonDate(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); }
const TODAY = londonDate(new Date());
function dayIndex(s){ return Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)) - Date.UTC(2026,9,1))/86400000); }
function prevDay(s){ const t=Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))-86400000; return new Date(t).toISOString().slice(0,10); }
let DAY = TODAY;
const nice=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
function allDays(){ const out=[]; let d=TODAY; while(dayIndex(d)>=0){ out.push(d); d=prevDay(d); } return out; }

// ---------- generator (seeded by date, so everyone gets the same board) ----------
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const D=[[1,0],[-1,0],[0,1],[0,-1]];
function placement(rnd){const p=[],used=new Array(N).fill(false);
  function go(r){if(r===N)return true;for(const c of shuffle([...Array(N).keys()],rnd)){if(used[c]||(r>0&&Math.abs(c-p[r-1])<=1))continue;used[c]=true;p[r]=c;if(go(r+1))return true;used[c]=false;}return false;}
  go(0);return p;}
function growRegions(p,rnd){const g=Array.from({length:N},()=>new Array(N).fill(-1)),size=new Array(N).fill(1);
  for(let r=0;r<N;r++)g[r][p[r]]=r;let left=N*N-N;
  while(left>0){const cand=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]===-1)for(const[dr,dc]of D){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N&&g[rr][cc]!==-1)cand.push([r,c,g[rr][cc]]);}
    let tot=0;const w=cand.map(x=>{const v=1/Math.pow(size[x[2]],1.2)*(0.3+rnd());tot+=v;return v;});let t=rnd()*tot,i=0;while(i<w.length-1&&t>w[i]){t-=w[i];i++;}
    const[r,c,k]=cand[i];g[r][c]=k;size[k]++;left--;}
  return g;}
function solve(g,limit){let count=0,nodes=0;const sols=[];const colU=new Array(N).fill(false),regU=new Array(N).fill(false),p=[];
  function go(r){if(count>=limit)return;if(r===N){count++;sols.push(p.slice());return;}
    for(let c=0;c<N;c++){if(colU[c]||regU[g[r][c]]||(r>0&&Math.abs(c-p[r-1])<=1))continue;nodes++;colU[c]=regU[g[r][c]]=true;p[r]=c;go(r+1);colU[c]=regU[g[r][c]]=false;}}
  go(0);return{count,nodes,sols};}
function connectedWithout(g,k,rr,cc){let start=null,total=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]===k&&!(r===rr&&c===cc)){total++;if(!start)start=[r,c];}
  if(!start)return false;const seen=new Set([start[0]*N+start[1]]),st=[start];while(st.length){const[r,c]=st.pop();for(const[dr,dc]of D){const a=r+dr,b=c+dc;if(a<0||a>=N||b<0||b>=N||(a===rr&&b===cc)||g[a][b]!==k||seen.has(a*N+b))continue;seen.add(a*N+b);st.push([a,b]);}}
  return seen.size===total;}
function repair(g,p,rnd){for(let it=0;it<300;it++){const s=solve(g,2);if(s.count===1)return s;
    const alt=s.sols.find(x=>x.some((c,r)=>c!==p[r]));const rows=shuffle([...Array(N).keys()].filter(r=>alt[r]!==p[r]),rnd);let moved=false;
    for(const r of rows){const c=alt[r];const k=g[r][c];const nbr=shuffle(D.map(([dr,dc])=>[r+dr,c+dc]).filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N&&g[a][b]!==k),rnd);
      if(!nbr.length||!connectedWithout(g,k,r,c))continue;g[r][c]=g[nbr[0][0]][nbr[0][1]];moved=true;break;}
    if(!moved)return null;}return null;}
function generate(seed){let best=null,found=0;
  for(let a=0;a<300&&found<8;a++){const rnd=mulberry32(hashStr(seed+'#'+a));const p=placement(rnd);const g=growRegions(p,rnd);const s=repair(g,p,rnd);
    if(s){found++;if(!best||s.nodes>best.nodes)best={grid:g,sol:p};}}
  return best;}

// ---------- state ----------
const lsKey=()=>'sosigdoku:v2:'+DAY;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let puzzle=null, cells=[], state=null, timerId=null;
let myId=null, myDoc=null, players=[], tab='today';
const $=id=>document.getElementById(id);
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');};

function freshState(){return{marks:Array(N*N).fill(0),mistakes:0,startedAt:null,finishedAt:null};}

// ---------- board ----------
function buildBoard(){
  const b=$('board'); b.style.gridTemplateColumns=`repeat(${N},minmax(0,1fr))`; b.style.gridTemplateRows=`repeat(${N},minmax(0,1fr))`; b.innerHTML=''; cells=[];
  const g=puzzle.grid, bw='1px solid var(--thin)', tw='1px solid var(--thin)';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const el=document.createElement('button'); el.className='cell'; el.type='button'; el.dataset.i=r*N+c;
    el.setAttribute('aria-label',`Row ${r+1}, column ${c+1}`);
    el.style.background=`var(--r${g[r][c]})`;
    el.style.borderTop = r>0 ? (g[r-1][c]!==g[r][c]?bw:tw) : '0';
    el.style.borderLeft= c>0 ? (g[r][c-1]!==g[r][c]?bw:tw) : '0';
    b.appendChild(el); cells.push(el);
  }
}
const X_SVG='<svg class="x" viewBox="0 0 10 10" preserveAspectRatio="none" aria-hidden="true"><path d="M1.5 1.5 8.5 8.5M8.5 1.5 1.5 8.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:2.5px"/></svg>';
const X_BAD=X_SVG.replace('class="x"','class="x bad"');
const DOG_SVG='<svg class="dogi" viewBox="0 0 48 26" aria-hidden="true"><use href="#dog"/></svg>';
function render(){
  let dogs=0;
  cells.forEach((el,i)=>{const m=state.marks[i];
    const want = m===2?'dog':m===3?'bad':m===1?'x':'';
    if(el.dataset.v!==want){el.dataset.v=want; el.innerHTML = m===2?DOG_SVG : m===3?X_BAD : m===1?X_SVG:'';}
    if(m===2)dogs++;
    el.setAttribute('aria-label',`Row ${Math.floor(i/N)+1}, column ${i%N+1}${m===2?', dog':m===3?', wrong guess':m===1?', marked':''}`);
  });
  $('dogCount').textContent=dogs+'/'+N;
  $('mistakes').textContent=state.mistakes; $('mistakes').className=state.mistakes?'bad':'';
  tick();
}
function elapsed(){ if(!state.startedAt)return 0; return (state.finishedAt||Date.now())-state.startedAt; }
function tick(){ const e=elapsed(); $('timer').textContent=fmt(e); $('scoreNow').textContent=fmt(e+state.mistakes*PENALTY); }

function autoCross(i){
  const r=Math.floor(i/N),c=i%N,k=puzzle.grid[r][c];
  for(let j=0;j<N*N;j++){ if(state.marks[j]!==0)continue; const rr=Math.floor(j/N),cc=j%N;
    if(rr===r||cc===c||puzzle.grid[rr][cc]===k||(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1)) state.marks[j]=1; }
}
function tryDog(i){
  const r=Math.floor(i/N),c=i%N;
  if(puzzle.sol[r]===c){ state.marks[i]=2; cells[i].classList.remove('hit'); void cells[i].offsetWidth; cells[i].classList.add('hit'); }
  else { state.mistakes++; state.marks[i]=3; cells[i].classList.remove('err'); void cells[i].offsetWidth; cells[i].classList.add('err'); }
}
function tapCell(i){
  if(!playing())return;
  const m=state.marks[i];
  if(m===2||m===3)return; // correct dogs and known mistakes are locked in
  if(m===0) state.marks[i]=1; else tryDog(i);
  afterMove();
}
function afterMove(){ save(); render(); if(state.marks.filter(m=>m===2).length===N) finish(); }
function playing(){ return state.startedAt && !state.finishedAt; }

// pointer: tap to cycle, drag to mark
let drag=null;
$('board').addEventListener('pointerdown',e=>{ const el=e.target.closest('.cell'); if(!el||!playing())return; drag={start:+el.dataset.i,moved:false,setTo:null}; });
$('board').addEventListener('pointermove',e=>{ if(!drag)return; const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell'); if(!el)return; const i=+el.dataset.i;
  if(i!==drag.start||drag.moved){ if(!drag.moved){drag.moved=true; drag.setTo= state.marks[drag.start]===1?0:1; mark(drag.start);} mark(i);} });
function mark(i){ if(state.marks[i]===2||state.marks[i]===3)return; if(state.marks[i]!==drag.setTo){state.marks[i]=drag.setTo; render();} }
window.addEventListener('pointerup',()=>{ if(!drag)return; const d=drag; drag=null; if(d.moved){save();} else tapCell(d.start); });
$('board').addEventListener('keydown',e=>{ const el=e.target.closest('.cell'); if(!el)return; const i=+el.dataset.i; let j=null;
  if(e.key==='ArrowRight')j=i%N<N-1?i+1:i; if(e.key==='ArrowLeft')j=i%N>0?i-1:i; if(e.key==='ArrowDown')j=i+N<N*N?i+N:i; if(e.key==='ArrowUp')j=i-N>=0?i-N:i;
  if(j!==null){e.preventDefault();cells[j].focus();}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();tapCell(i);} });

function save(){ lsSet(lsKey(),state); }

// ---------- confetti ----------
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
  const W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--dog','--accent','--r0','--r1','--r2','--r3','--r4','--r5','--gold'].map(v=>cs.getPropertyValue(v).trim()||'#c84');
  const ps=[]; const burst=(x,dir)=>{ for(let i=0;i<90;i++){ const a=(-90+dir*35+(Math.random()-.5)*70)*Math.PI/180, sp=7+Math.random()*9;
    ps.push({x,y:H*0.85,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:6+Math.random()*6,h:8+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],sway:Math.random()*6}); } };
  burst(W*0.15,1); burst(W*0.85,-1); setTimeout(()=>burst(W*0.5,0),250);
  const t0=performance.now();
  (function frame(t){ const el=t-t0; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=0.28; p.vx*=0.985; p.vy*=0.985; p.x+=p.vx+Math.sin((el/300)+p.sway)*0.6; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-el/3800); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+2); ctx.restore(); });
    if(el<3800) requestAnimationFrame(frame); else cv.remove(); })(t0);
}

// ---------- flow ----------
let joinMode='new';
function setJoinMode(m){ joinMode=m; $('joinNew').hidden=m!=='new'; $('joinCode').hidden=m!=='code'; }
$('haveCode').addEventListener('click',()=>setJoinMode('code'));
$('newPlayer').addEventListener('click',()=>setJoinMode('new'));
function showVeil(title,text,{start=false,name=false}={}){ $('veil').hidden=false; $('veilTitle').textContent=title; $('veilText').textContent=text; $('startBtn').hidden=!start; $('nameBox').hidden=!name; $('startBtn').textContent=name?'Join and start':'Start the clock'; }
function updateVeil(){
  if(!puzzle) return;
  if(state.finishedAt||state.startedAt){ $('veil').hidden=true; return; }
  const needJoin = online && !me;
  showVeil(DAY===TODAY?'Ready when you are':'Catching up on '+nice(DAY),'The clock starts as soon as you tap. You get one go at each puzzle, so make it count.',{start:true,name:needJoin});
}
function veilError(msg){ $('veilText').textContent=msg; $('startBtn').disabled=false; }
$('startBtn').addEventListener('click',async()=>{
  const btn=$('startBtn');
  if(online && !me){
    btn.disabled=true;
    try{
      if(joinMode==='new'){
        const n=$('nameInput').value.trim();
        if(!n) return veilError('Pop your name in first so your friends know who to beat.');
        const row=(await rpc('join_league',{p_name:n}))[0];
        setMe({id:row.player_id,name:row.player_name,key:row.player_key});
      } else {
        const code=normCode($('codeInput').value);
        if(code.length!==8) return veilError('Player codes are 8 letters and numbers, like K7QM-2XPA.');
        const rows=await rpc('sign_in',{p_key:code});
        if(!rows||!rows.length) return veilError("That code doesn't match a player. Check it and try again.");
        setMe({id:rows[0].player_id,name:rows[0].player_name,key:code});
        await refresh();
        if(state.startedAt||state.finishedAt){ btn.disabled=false; return; } // already played this one on another device
      }
    }catch(e){ return veilError("Couldn't reach the leaderboard. Check your connection and try again."); }
    btn.disabled=false;
  }
  state.startedAt=Date.now(); save();
  $('veil').hidden=true; startTimer(); render();
  if(me){ try{ const st=await rpc('start_play',{p_key:me.key,p_day:DAY}); const t=Date.parse(st); if(t && t<state.startedAt-5000){ state.startedAt=t; save(); tick(); } refresh(); }catch(e){ lbWarn("Your start wasn't saved to the leaderboard. Keep playing; we'll try again when you finish."); } }
});
function startTimer(){ clearInterval(timerId); timerId=setInterval(tick,250); }
async function finish(){
  state.finishedAt=Date.now(); save(); clearInterval(timerId); tick(); confetti();
  const ms=state.finishedAt-state.startedAt, score=ms+state.mistakes*PENALTY;
  showDone(ms,state.mistakes,score); fillDays();
  if(me){
    try{
      await rpc('start_play',{p_key:me.key,p_day:DAY}); // makes sure a start exists
      const r=(await rpc('finish_play',{p_key:me.key,p_day:DAY,p_mistakes:state.mistakes,p_client_ms:ms}))[0];
      if(r) showDone(r.out_ms,r.out_mistakes,r.out_score);
      refresh();
    }catch(e){ lbWarn("Your score couldn't be posted. Check your connection and refresh."); }
  }
}
function showDone(ms,mistakes,score){
  const c=$('doneCard'); c.hidden=false;
  c.innerHTML=`${DAY===TODAY?"You have completed today's Sosig quiz.":'You have completed the Sosig quiz for '+nice(DAY)+'.'} <b>${fmt(score)}</b> score <span style="color:var(--muted)">(${fmt(ms)} + ${mistakes} mistake${mistakes===1?'':'s'} × 30s)</span>${DAY===TODAY?'. New puzzle at midnight.':'.'}`;
}

// ---------- players & leaderboard data (Supabase) ----------
const online = !!(SUPABASE_URL && SUPABASE_KEY);
let me = lsGet('sosigdoku:me'); // {id,name,key}
function setMe(m){ me=m; myId=m?m.id:null; if(m) lsSet('sosigdoku:me',m); else { try{localStorage.removeItem('sosigdoku:me');}catch(e){} } renderMe(); }
function normCode(v){ return (v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function prettyCode(k){ return k?k.slice(0,4)+'-'+k.slice(4):''; }
function lbWarn(msg){ $('lbNote').className='note warn'; $('lbNote').textContent=msg; }
async function api(path,opts={}){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};
  if(SUPABASE_KEY.startsWith('eyJ')) h.Authorization='Bearer '+SUPABASE_KEY;
  const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{...opts,headers:h});
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&j.message)||('HTTP '+r.status));
  return j;
}
const rpc=(fn,args)=>api('rpc/'+fn,{method:'POST',body:JSON.stringify(args)});
async function refresh(){
  if(!online) return;
  try{
    const [names,plays]=await Promise.all([api('player_names?select=id,name'),api('plays?select=player_id,day,started_at,ms,mistakes,score')]);
    const byId={}; names.forEach(n=>byId[n.id]={id:n.id,data:{name:n.name,results:{},started:{}}});
    plays.forEach(p=>{const o=byId[p.player_id]; if(!o)return; o.data.started[p.day]=Date.parse(p.started_at); if(p.score!=null) o.data.results[p.day]={ms:p.ms,mistakes:p.mistakes,score:p.score,at:Date.parse(p.started_at)+p.ms};});
    players=Object.values(byId);
    $('lbNote').textContent='';
    if(me){ const mine=byId[me.id]; if(mine){ myDoc=mine.data; if(mine.data.name!==me.name) setMe({...me,name:mine.data.name}); } else { setMe(null); myDoc=null; } }
    if(puzzle&&state){ const had=state.finishedAt, hadStart=state.startedAt; syncFromServer();
      if(state.finishedAt&&!had){ clearInterval(timerId); const ms=state.finishedAt-state.startedAt; showDone(ms,state.mistakes,ms+state.mistakes*PENALTY); render(); }
      else if(state.startedAt&&!hadStart){ startTimer(); render(); } }
    fillDays(); renderMe(); renderLB(); updateVeil();
  }catch(e){ lbWarn("Couldn't load the leaderboard just now. It'll try again shortly."); }
}
function renderMe(){
  if(!me){ $('youRow').hidden=true; return; }
  $('youRow').hidden=false; $('youName').textContent=me.name; $('youCode').textContent=prettyCode(me.key);
}
$('copyCode').addEventListener('click',async()=>{ const b=$('copyCode'); try{ await navigator.clipboard.writeText(prettyCode(me.key)); b.textContent='Copied'; }catch(e){ const r=document.createRange(); r.selectNodeContents($('youCode')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent='Selected'; } setTimeout(()=>b.textContent='Copy',1500); });
$('switchBtn').addEventListener('click',()=>{ setMe(null); myDoc=null; setJoinMode('code'); renderLB(); loadDay(DAY); });
$('renameBtn').addEventListener('click',()=>{ $('renameRow').hidden=false; $('renameInput').value=me.name; $('renameInput').focus(); });
$('renameCancel').addEventListener('click',()=>{ $('renameRow').hidden=true; });
$('renameSave').addEventListener('click',async()=>{ const n=$('renameInput').value.trim(); if(!n)return;
  try{ await rpc('rename_player',{p_key:me.key,p_name:n}); setMe({...me,name:n}); $('renameRow').hidden=true; refresh(); }
  catch(e){ lbWarn("Couldn't change your name. Try again in a moment."); } });
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function renderLB(){
  const box=$('lb');
  if(!online){ box.innerHTML='<div class="empty">The leaderboard isn\'t set up yet. You can still play the puzzle.</div>'; return; }
  const named=players.filter(p=>p.data&&p.data.name);
  if(tab==='today'){
    const done=named.filter(p=>p.data.results&&p.data.results[DAY]).sort((a,b)=>a.data.results[DAY].score-b.data.results[DAY].score);
    const going=named.filter(p=>!(p.data.results&&p.data.results[DAY])&&p.data.started&&p.data.started[DAY]);
    const head=`<div class="note" style="margin:0 0 8px">${DAY===TODAY?'Today':nice(DAY)} · puzzle #${dayIndex(DAY)+1}</div>`;
    if(!done.length&&!going.length){ box.innerHTML=head+'<div class="empty">Nobody has finished this puzzle yet. First on the board sets the time to beat.</div>'; return; }
    let h=head+'<table><thead><tr><th></th><th>Player</th><th class="num">Time</th><th class="num">Mistakes</th><th class="num">Score</th></tr></thead><tbody>';
    done.forEach((p,i)=>{const r=p.data.results[DAY]; h+=`<tr class="${p.id===myId?'me':''}"><td class="rank ${i===0?'first':''}">${i===0?'🏆':i+1}</td><td>${esc(p.data.name)}</td><td class="num">${fmt(r.ms)}</td><td class="num">${r.mistakes}</td><td class="num"><b>${fmt(r.score)}</b></td></tr>`;});
    going.forEach(p=>{h+=`<tr class="${p.id===myId?'me':''}"><td class="rank">–</td><td>${esc(p.data.name)}</td><td class="num" colspan="3"><span class="pill">Still sniffing about</span></td></tr>`;});
    box.innerHTML=h+'</tbody></table>';
  } else {
    // daily winners (lowest score; ties share the win)
    const days={}; named.forEach(p=>Object.entries(p.data.results||{}).forEach(([d,r])=>{(days[d]=days[d]||[]).push({id:p.id,score:r.score});}));
    const dayWinners={}; Object.entries(days).forEach(([d,arr])=>{ const best=Math.min(...arr.map(x=>x.score)); dayWinners[d]=arr.filter(x=>x.score===best).map(x=>x.id); });
    const stats=(p,filter)=>{const res=p.data.results||{}; const ds=Object.keys(res).filter(filter); const sc=ds.map(d=>res[d].score);
      return {played:ds.length, wins:ds.filter(d=>dayWinners[d]&&dayWinners[d].includes(p.id)).length, best:sc.length?Math.min(...sc):null, avg:sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null};};
    const rank=(a,b)=>b.wins-a.wins||(a.avg-b.avg);
    const thisWeek=weekOf(TODAY);
    // weekly awards for completed weeks: winner gets a trophy, everyone else who played gets a wooden spoon
    const weeks={}; Object.keys(days).forEach(d=>{const w=weekOf(d); if(w!==thisWeek) weeks[w]=1;});
    const trophies={}, spoons={}, awards={};
    Object.keys(weeks).sort().forEach(w=>{ const rs=named.map(p=>({id:p.id,name:p.data.name,...stats(p,d=>weekOf(d)===w)})).filter(x=>x.played).sort(rank); if(!rs.length)return;
      const win=rs.filter(x=>x.wins===rs[0].wins&&x.avg===rs[0].avg), lose=rs.filter(x=>!win.includes(x));
      win.forEach(x=>trophies[x.id]=(trophies[x.id]||0)+1); lose.forEach(x=>spoons[x.id]=(spoons[x.id]||0)+1);
      awards[w]={win:win.map(x=>x.name),lose:lose.map(x=>x.name)}; });
    if(tab==='week'){
      const rows=named.map(p=>({p,...stats(p,d=>weekOf(d)===thisWeek)})).filter(x=>x.played).sort(rank);
      const mon=new Date(thisWeek+'T12:00:00Z'), sun=new Date(mon.getTime()+6*86400000), f=x=>x.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
      const lastW=weekOf(prevDay(thisWeek)), la=awards[lastW];
      let h=la?`<div class="awards"><div class="awt">Last week's awards</div><div>🏆 ${la.win.map(esc).join(', ')}</div>${la.lose.length?`<div>🥄 ${la.lose.map(esc).join(', ')}</div>`:''}</div>`:'';
      h+=`<div class="note" style="margin:0 0 8px">Week of ${f(mon)} to ${f(sun)}</div>`;
      if(!rows.length){ box.innerHTML=h+'<div class="empty">No puzzles finished this week yet.</div>'; return; }
      h+='<table><thead><tr><th></th><th>Player</th><th class="num">Daily wins</th><th class="num">Played</th><th class="num">Avg</th></tr></thead><tbody>';
      rows.forEach((x,i)=>{h+=`<tr class="${x.p.id===myId?'me':''}"><td class="rank ${i===0?'first':''}">${i===0?'🏆':i+1}</td><td>${esc(x.p.data.name)}</td><td class="num"><b>${x.wins}</b></td><td class="num">${x.played}</td><td class="num">${fmt(x.avg)}</td></tr>`;});
      box.innerHTML=h+'</tbody></table><div class="note">Most daily wins takes the week and a trophy 🏆; everyone else who played gets a wooden spoon 🥄. Ties go to the lower average score. The week closes Sunday at midnight.</div>';
    } else {
      const rows=named.map(p=>{const st=stats(p,d=>d!==TODAY); const all=stats(p,()=>true); const res=p.data.results||{};
        let streak=0, d=res[TODAY]?TODAY:prevDay(TODAY); while(res[d]){streak++; d=prevDay(d);}
        return {p, weekly:trophies[p.id]||0, spoons:spoons[p.id]||0, daily:st.wins, played:all.played, best:all.best, avg:all.avg, streak};
      }).filter(x=>x.played).sort((a,b)=>b.weekly-a.weekly||b.daily-a.daily||(a.avg-b.avg));
      if(!rows.length){ box.innerHTML='<div class="empty">No finished puzzles yet. The overall league fills up as people play.</div>'; return; }
      let h='<table><thead><tr><th></th><th>Player</th><th class="num" title="Weekly trophies">🏆</th><th class="num" title="Wooden spoons">🥄</th><th class="num">Daily wins</th><th class="num">Played</th><th class="num">Streak</th><th class="num">Best</th></tr></thead><tbody>';
      rows.forEach((x,i)=>{h+=`<tr class="${x.p.id===myId?'me':''}"><td class="rank ${i===0?'first':''}">${i===0?'🏆':i+1}</td><td>${esc(x.p.data.name)}</td><td class="num"><b>${x.weekly}</b></td><td class="num">${x.spoons}</td><td class="num">${x.daily}</td><td class="num">${x.played}</td><td class="num">${x.streak}</td><td class="num">${fmt(x.best)}</td></tr>`;});
      box.innerHTML=h+'</tbody></table><div class="note">🏆 weekly trophies and 🥄 wooden spoons are handed out when each week closes on Sunday at midnight. Ranked by trophies, then daily wins.</div>';
    }
  }
}
function weekOf(s){ const t=Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)); const dow=(new Date(t).getUTCDay()+6)%7; return new Date(t-dow*86400000).toISOString().slice(0,10); }
function setTab(t){ tab=t; ['Today','Week','All'].forEach(n=>$('tab'+n).setAttribute('aria-selected',t===n.toLowerCase())); renderLB(); }
$('tabToday').addEventListener('click',()=>setTab('today')); $('tabWeek').addEventListener('click',()=>setTab('week')); $('tabAll').addEventListener('click',()=>setTab('all'));

// ---------- boot ----------
function syncFromServer(){
  const r0=myDoc&&myDoc.results&&myDoc.results[DAY], st=myDoc&&myDoc.started&&myDoc.started[DAY];
  if(!state)return;
  if(r0&&!state.finishedAt){ state.startedAt=st||state.startedAt||(r0.at-r0.ms); state.finishedAt=state.startedAt+r0.ms; state.mistakes=r0.mistakes; save(); }
  else if(st&&!state.startedAt){ state.startedAt=st; save(); }
}
function fillDays(){
  const sel=$('daySel'), res=(myDoc&&myDoc.results)||{};
  sel.innerHTML=allDays().map(d=>`<option value="${d}"${d===DAY?' selected':''}>${d===TODAY?'Today':nice(d)} · #${dayIndex(d)+1}${res[d]?' ✓':''}</option>`).join('');
}
$('daySel').addEventListener('change',e=>loadDay(e.target.value));
function loadDay(d){
  clearInterval(timerId); DAY=d; $('doneCard').hidden=true; fillDays();
  showVeil("Fetching the dogs…","Building the board.");
  setTimeout(()=>{
    puzzle=generate('sausagedoku:'+DAY);
    state=lsGet(lsKey())||freshState(); syncFromServer();
    buildBoard(); render();
    if(state.finishedAt){ const ms=state.finishedAt-state.startedAt; showDone(ms,state.mistakes,ms+state.mistakes*PENALTY); }
    else if(state.startedAt) startTimer();
    updateVeil(); renderLB();
  },30);
}
myId=me?me.id:null; renderMe();
